
name: Build Android APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Générer le projet Android si absent
        run: |
          if [ ! -d android ]; then
            flutter create --platforms=android --org com.socialgrow --project-name socialgrow_ai .
          fi

      - name: Installer les dépendances
        run: flutter pub get

      - name: Analyse statique
        run: flutter analyze

      - name: Tests
        run: flutter test

      - name: Analyser la taille de l'application
        run: flutter build apk --release --analyze-size --target-platform android-arm

      - name: Générer les APK séparés par architecture
        run: flutter build apk --release --split-per-abi

      - name: Afficher les tailles
        run: |
          echo "=== Tailles des APK ==="
          find build/app/outputs/flutter-apk -maxdepth 1 -name "*.apk" -exec ls -lh {} \;
          echo "=== Rapports d'analyse de taille ==="
          find build -type f -iname "*analysis*.json" -print

      - name: Publier les APK et rapports
        uses: actions/upload-artifact@v4
        with:
          name: socialgrow-ai-optimized-diagnostic
          path: |
            app/build/app/outputs/flutter-apk/*.apk
            app/build/**/*.json
          if-no-files-found: error
