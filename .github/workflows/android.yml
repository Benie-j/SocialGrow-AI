
name: Build Android APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  functions-tests:
    name: Tests des Edge Functions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Vérification des types et tests
        run: |
          deno check supabase/functions/facebook-list-pages/index.ts supabase/functions/facebook-connect-page/index.ts
          deno test -A supabase/functions/tests

  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Générer le projet Android si absent
        run: |
          if [ ! -d android ]; then
            flutter create --platforms=android --org com.socialgrow --project-name socialgrow_ai .
          fi

      - name: Configurer le deep link Android
        run: python ../scripts/configure_android_deeplink.py android/app/src/main/AndroidManifest.xml

      - name: Vérifier le manifeste Android
        run: |
          grep -E "INTERNET|flutter_deeplinking|intent-filter|android:scheme|android:host|launchMode|android:exported" android/app/src/main/AndroidManifest.xml | sed 's/^ *//' | while read -r l; do echo "::notice title=manifest::$l"; done

      - name: Installer les dépendances
        run: flutter pub get

      - name: Analyse statique
        run: |
          set +e
          flutter analyze 2>&1 | tee /tmp/analyze.txt
          code=${PIPESTATUS[0]}
          grep -E "^\s*(error|warning|info) " /tmp/analyze.txt | head -30 | while read -r l; do echo "::error title=flutter analyze::$l"; done
          exit $code

      - name: Tests
        run: |
          set +e
          flutter test 2>&1 | tee /tmp/test.txt
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ]; then
            grep -E "\[E\]|EXCEPTION CAUGHT|overflowed|Expected:|Actual:|Which:" /tmp/test.txt | head -30 | cut -c1-300 | while read -r l; do echo "::error title=flutter test::$l"; done
          fi
          exit $code

      - name: Compiler les APK release (un par architecture)
        run: |
          set +e
          flutter build apk --release --split-per-abi 2>&1 | tee /tmp/build.txt
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ]; then
            grep -nE "error|Error|FAILURE|What went wrong|Execution failed|Caused by|e: " /tmp/build.txt | head -20 | cut -c1-400 | while read -r l; do echo "::error title=flutter build::$l"; done
          fi
          exit $code

      - name: Afficher les tailles
        run: ls -lh build/app/outputs/flutter-apk/*.apk

      - name: APK arm64-v8a (téléphones Android récents, 64 bits)
        uses: actions/upload-artifact@v4
        with:
          name: socialgrow-ai-arm64-v8a
          path: app/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          if-no-files-found: error

      - name: APK armeabi-v7a (anciens téléphones, 32 bits)
        uses: actions/upload-artifact@v4
        with:
          name: socialgrow-ai-armeabi-v7a
          path: app/build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
          if-no-files-found: error

      - name: APK x86_64 (émulateurs et appareils x86)
        uses: actions/upload-artifact@v4
        with:
          name: socialgrow-ai-x86_64
          path: app/build/app/outputs/flutter-apk/app-x86_64-release.apk
          if-no-files-found: error
